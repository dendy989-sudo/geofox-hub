name: Alfred repair checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: alfred-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  alfred-ci:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'alfred/repair-')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
